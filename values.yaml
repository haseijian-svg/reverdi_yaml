replicaCount: 3

image:
  repository: 10.0.50.10:5000/reverdi-app # 로컬 레지스트리 (node5)
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: true
  className: "traefik"
  hosts:
    - host: reverdi.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 2

env:
  DATABASE_URL: "postgresql://reverdi_user:reverdi_pass@reverdi-db-rw.reluxe.svc.cluster.local:5432/reverdi"
  SECRET_KEY: "cloudedx-secret-key-change-in-prod"
  APP_ENV: "production"

cronjobs:
  crawler:
    schedule: "*/30 * * * *"
    image: 10.0.50.10:5000/reverdi-crawler:latest
  aggregate:
    schedule: "*/10 * * * *"
    image: 10.0.50.10:5000/reverdi-app:latest
  pgdump:
    schedule: "0 2 * * *"
    image: 10.0.50.10:5000/reverdi-backup:latest

nodeSelector:
  web:
    node-role.kubernetes.io/web: "true"
  batch:
    node-role.kubernetes.io/batch: "true"